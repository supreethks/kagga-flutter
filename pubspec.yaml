name: kagga
description: "Access all Mankutimmana kagga in a simple app"
publish_to: 'none'
version: 2.1.2+27

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.4.1
  path: ^1.8.3
  flutter_platform_widgets: ^7.0.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  firebase_core: ^2.24.2
  firebase_crashlytics: ^3.4.9
  share_plus: ^10.1.3
  url_launcher: ^6.2.2
  package_info_plus: ^8.1.2
  webview_flutter: ^4.7.0
  app_settings: ^5.1.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_icons: 
  android: true
  ios: true
  image_path: "assets/kagga_icon.png"
  min_sdk_android: 21
  prefix: ""

flutter:
  uses-material-design: true
  assets:
    - assets/kagga_v5.sqlite
    - assets/images/
    - assets/images/favorite_thumb.png
    - assets/kagga_sequence.json
  generate: true

l10n:
  arb-dir: "lib/l10n"
  template-arb-file: "app_en.arb"
  output-localization-file: "app_localizations.dart"